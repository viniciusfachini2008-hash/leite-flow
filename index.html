<title>LEITE FLOW</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: página de doação em coluna única com faixa de contato; painel em abas, rota como linha do tempo vertical. */
:root{
  --bg:#F3F7F8; --surface:#FFFFFF; --surface2:#E8F0F2; --ink:#10282E; --muted:#51666C; --line:#D3DFE2;
  --teal:#16565E; --teal-ink:#FFFFFF; --gold:#E3A71D; --gold-soft:#FBEFCF; --gold-ink:#4A3300;
  --ok:#1B7A4E; --ok-soft:#DDF3E8; --bad:#B03A2E; --bad-soft:#FBE3E0;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C181C; --surface:#13242A; --surface2:#1A2F36; --ink:#E6EFF1; --muted:#9BB1B7; --line:#26404A;
  --teal:#6CC3CB; --teal-ink:#06262A; --gold:#EDB93E; --gold-soft:#35290A; --gold-ink:#F6DFA0;
  --ok:#6AD3A0; --ok-soft:#123425; --bad:#F39286; --bad-soft:#3A1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C181C; --surface:#13242A; --surface2:#1A2F36; --ink:#E6EFF1; --muted:#9BB1B7; --line:#26404A;
  --teal:#6CC3CB; --teal-ink:#06262A; --gold:#EDB93E; --gold-soft:#35290A; --gold-ink:#F6DFA0;
  --ok:#6AD3A0; --ok-soft:#123425; --bad:#F39286; --bad-soft:#3A1A17; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5.4vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.55rem,3.2vw,2.2rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--teal)}
.mono{font-family:var(--font-mono)}
.eyebrow{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:800;letter-spacing:.02em;font-size:1.15rem}
nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
nav a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500;font-size:.95rem}
nav a:hover{background:var(--surface2)}
nav a[aria-current="page"]{background:var(--surface2)}

.btn{font:inherit;font-weight:600;min-height:44px;padding:.6rem 1.1rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.btn.gold{background:var(--gold);color:#2A1D00;border-color:var(--gold)}
.btn.small{min-height:36px;padding:.3rem .8rem;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

section.block{padding-block:clamp(32px,6vw,64px)}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:32px;align-items:center;padding-block:clamp(28px,6vw,64px)}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:56ch;margin-top:16px}
.hero .row{margin-top:24px}
.jar{width:100%;max-width:260px;justify-self:center}
.jar-cap{font-size:.82rem;color:var(--muted);text-align:center;margin-top:6px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact{padding:18px 16px;border-right:1px solid var(--line);min-width:0}
.fact:last-child{border-right:0}
.fact b{display:block;font-family:var(--font-display);font-size:1.7rem;font-weight:800;line-height:1.1}
.fact span{font-size:.9rem;color:var(--muted)}
@media (max-width:560px){.fact{border-right:0;border-bottom:1px solid var(--line)}.fact:last-child{border-bottom:0}}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px)}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.two h2{margin-bottom:14px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ticks li{padding-left:28px;position:relative}
.ticks li::before{content:"";position:absolute;left:4px;top:.55em;width:10px;height:6px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.ticks.no li::before{border:0;width:12px;height:2px;background:var(--bad);transform:none;top:.8em}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:14px}
.steps li{counter-increment:s;padding-left:44px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#2A1D00;font-family:var(--font-mono);font-weight:500;display:grid;place-items:center}
.note{background:var(--gold-soft);color:var(--gold-ink);border-radius:10px;padding:12px 14px;font-size:.95rem}

.contact{background:var(--teal);color:var(--teal-ink);border-radius:16px;padding:clamp(20px,4vw,36px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px}
.contact a{color:inherit}
.contact h2{margin-bottom:10px}
.contact dl{margin:0;display:grid;gap:10px}
.contact dt{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.contact dd{margin:0;font-size:1.05rem}
.contact .tel{font-family:var(--font-mono);font-size:1.5rem}
.contact .btn{background:transparent;color:inherit;border-color:currentColor}
@media (max-width:760px){.contact{grid-template-columns:1fr}}
.towns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding:0;list-style:none}
.towns li{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.92rem;background:var(--surface)}

details{border-bottom:1px solid var(--line);padding:14px 0}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details summary::after{content:"+";font-family:var(--font-mono)}
details[open] summary::after{content:"−"}
details p{margin-top:8px;color:var(--muted);max-width:68ch}

.band{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,32px);display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.band p{color:var(--muted);max-width:60ch;margin-top:8px}
.sources{font-size:.88rem;color:var(--muted)}
.sources ul{padding-left:18px;margin:8px 0 0;display:grid;gap:4px}
footer{border-top:1px solid var(--line);padding-block:24px 40px;font-size:.88rem;color:var(--muted)}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px)}
.auth{max-width:520px;margin:0 auto;padding-block:clamp(28px,6vw,56px)}
.auth h1{font-size:clamp(1.8rem,4vw,2.4rem);margin-bottom:6px}
.auth .sub{color:var(--muted);margin-bottom:20px}
form{display:grid;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.92rem}
.field small{color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],input[type=date]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;min-height:46px;width:100%}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer}
.choice input{margin-top:5px;accent-color:var(--teal)}
.choice:has(input:checked){border-color:var(--teal);background:var(--surface2)}
.choice b{display:block;font-weight:600}
.choice span{font-size:.88rem;color:var(--muted)}
.err{color:var(--bad);background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.info{color:var(--gold-ink);background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.alt{margin-top:16px;color:var(--muted);font-size:.95rem}

/* painel */
.panel{padding-block:clamp(20px,4vw,40px);display:grid;gap:20px}
.phead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.next{background:var(--gold);color:#2A1D00}
.pill.ex{background:var(--gold-soft);color:var(--gold-ink)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.prog{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal)}
.next-card{border:2px solid var(--gold);border-radius:14px;padding:18px;background:var(--surface);display:grid;gap:10px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;padding:12px 0;position:relative}
.timeline li::before{content:"";position:absolute;left:11px;top:34px;bottom:-12px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.dot{width:24px;height:24px;border-radius:50%;border:3px solid var(--line);background:var(--surface);margin-top:2px}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.next{border-color:var(--gold);background:var(--gold)}
.timeline .nm{font-weight:600}
.timeline .ad{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.qv{display:flex;gap:8px;flex-wrap:wrap}
.qv button{font:inherit;font-family:var(--font-mono);min-height:44px;min-width:64px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.qv button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.overlay{position:fixed;inset:0;background:rgba(5,15,18,.6);z-index:20;display:grid;place-items:center;padding:16px;overflow:auto}
.overlay .card{width:min(520px,100%);max-height:100%;overflow:auto}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.93rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.label{border:2px solid var(--ink);border-radius:8px;padding:14px;background:var(--surface);display:grid;gap:8px}
.label .code{font-family:var(--font-mono);font-size:1.25rem;letter-spacing:.04em}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.res{border-radius:14px;padding:18px;display:grid;gap:10px}
.res.ok{background:var(--ok-soft);color:var(--ok)}
.res.bad{background:var(--bad-soft);color:var(--bad)}
.res.pend{background:var(--gold-soft);color:var(--gold-ink)}
.res h3{font-size:1.4rem}
.res ul{margin:0;padding-left:20px;color:var(--ink)}
.stepper{font-family:var(--font-mono);font-size:.85rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw;font-size:.95rem}
@media (prefers-reduced-motion: no-preference){.prog i{transition:width .3s}}
</style>

<header class="top"><div class="wrap bar">
  <a class="brand" href="#sobre"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C12 2 5 10 5 15a7 7 0 0 0 14 0C19 10 12 2 12 2z" fill="var(--gold)"/></svg>LEITE FLOW</a>
  <nav id="nav" aria-label="Principal"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>
  Protótipo do sistema LEITE FLOW para o Banco de Leite Humano de Marília. As informações desta página não substituem a orientação da equipe do banco. Os dados de cadastro, rota e coletas ficam guardados só neste navegador.
</footer></div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
var mem={};
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){} return (k in mem)?mem[k]:d},
  set:function(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var app=document.getElementById('app'), nav=document.getElementById('nav'), toastEl=document.getElementById('toast');
var notice='', tab=null, tri={step:0,d:{}}, triErr='', ficha=null, fichaVol=200, toastT=null;
var PHONE='(14) 3413-8696';
var ZONAS={1:'Zona Norte',2:'Zona Sul',3:'Zona Oeste',4:'Zona Leste',5:'Zona Rural e Maracá'};
var SEED=[
  {id:'e1',nome:'Doadora exemplo 1',end:'',done:false,ex:true},
  {id:'e2',nome:'Doadora exemplo 2',end:'',done:false,ex:true},
  {id:'e3',nome:'Doadora exemplo 3',end:'',done:false,ex:true}
];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){toastEl.hidden=true},3200)}
function users(){return store.get('lf_users',[])}
function cur(){var em=store.get('lf_session',null);if(!em)return null;return users().filter(function(u){return u.email===em})[0]||null}
function isDoadora(u){return u&&u.perfil==='doadora'}
async function hash(pw,salt){
  try{var b=new TextEncoder().encode(salt+pw);var d=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
  catch(e){return 'x:'+salt+':'+pw.split('').reverse().join('')}
}
function fmtDate(d){return new Date(d).toLocaleDateString('pt-BR')}
function fmtDT(d){var x=new Date(d);return x.toLocaleDateString('pt-BR')+' às '+x.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function pad(n,l){return String(n).padStart(l,'0')}

/* ---------- navegação ---------- */
function renderNav(u,h){
  var links=[['sobre','Doação em Marília']];
  var html=links.map(function(l){return '<a href="#'+l[0]+'"'+(h===l[0]?' aria-current="page"':'')+'>'+l[1]+'</a>'}).join('');
  if(u){
    html+='<a href="#painel"'+(h==='painel'?' aria-current="page"':'')+'>Painel</a><button class="btn small" data-a="logout" type="button">Sair</button>';
  }else{
    html+='<a href="#entrar"'+(h==='entrar'?' aria-current="page"':'')+'>Entrar</a><a class="btn primary small" href="#cadastro">Criar conta</a>';
  }
  nav.innerHTML=html;
}
function route(){
  var h=(location.hash||'#sobre').slice(1);
  if(['sobre','entrar','cadastro','painel'].indexOf(h)<0)h='sobre';
  var u=cur();
  if(h==='painel'&&!u){notice='Entre na sua conta para abrir o painel.';location.hash='#entrar';return}
  if((h==='entrar'||h==='cadastro')&&u){location.hash='#painel';return}
  renderNav(u,h);
  if(h==='sobre')app.innerHTML=viewSobre();
  else if(h==='entrar')app.innerHTML=viewEntrar();
  else if(h==='cadastro')app.innerHTML=viewCadastro();
  else{ if(!tab)tab=isDoadora(u)?'triagem':'rota'; app.innerHTML=viewPainel(u)}
  window.scrollTo(0,0);
}
function paint(){var u=cur();if(u)app.innerHTML=viewPainel(u)}

/* ---------- página sobre a doação ---------- */
function jar(){
  return '<svg class="jar" viewBox="0 0 200 250" role="img" aria-label="Frasco de coleta com marcas de 100, 200 e 300 mL">'
  +'<rect x="58" y="14" width="84" height="28" rx="6" fill="var(--teal)"/>'
  +'<rect x="44" y="42" width="112" height="184" rx="22" fill="var(--surface)" stroke="var(--line)" stroke-width="3"/>'
  +'<rect x="50" y="116" width="100" height="104" rx="18" fill="var(--gold-soft)"/>'
  +'<path d="M50 118 q12 -7 25 0 t25 0 t25 0 t25 0" fill="none" stroke="var(--gold)" stroke-width="3"/>'
  +'<g stroke="var(--muted)" stroke-width="2"><line x1="36" y1="166" x2="46" y2="166"/><line x1="36" y1="116" x2="46" y2="116"/><line x1="36" y1="66" x2="46" y2="66"/></g>'
  +'<g font-family="IBM Plex Mono,monospace" font-size="11" fill="var(--muted)" text-anchor="end"><text x="32" y="170">100</text><text x="32" y="120">200</text><text x="32" y="70">300</text></g>'
  +'</svg>';
}
function viewSobre(){
  var towns=['Campos Novos Paulista','Ocauçu','Alvinlândia','Lupércio','Garça','Pompeia','Quintana','Osvaldo Cruz','Bastos','Lucélia','Adamantina'];
  return ''
  +'<section class="hero"><div>'
  +'<p class="eyebrow">Banco de Leite Humano de Marília</p>'
  +'<h1 style="margin-top:10px">O leite que sobra na sua casa alimenta um prematuro na UTI.</h1>'
  +'<p class="lead">Um único frasco pode alimentar até 10 bebês prematuros ou de baixo peso, segundo o Ministério da Saúde. Se você amamenta e produz mais do que seu bebê precisa, você pode doar.</p>'
  +'<div class="row"><a class="btn gold" href="#cadastro">Quero ser doadora</a><button class="btn" type="button" data-a="scroll" data-t="como">Ver como doar</button></div>'
  +'</div><div>'+jar()+'<p class="jar-cap">Volumes de referência da ficha de coleta, de 100 a 300 mL.</p></div></section>'

  +'<div class="facts" role="list">'
  +'<div class="fact" role="listitem"><b>4º</b><span>banco de leite implantado no estado de São Paulo</span></div>'
  +'<div class="fact" role="listitem"><b>3 UTIs</b><span>neonatais atendidas: Materno Infantil, Hospital Universitário da Unimar e Maternidade Gota de Leite</span></div>'
  +'<div class="fact" role="listitem"><b>11 postos</b><span>de coleta em cidades da região</span></div>'
  +'<div class="fact" role="listitem"><b>~64 doadoras</b><span>cadastradas. O ideal seria entre 100 e 120</span></div>'
  +'</div>'

  +'<section class="block two" id="quem">'
  +'<div><h2>Quem pode doar</h2><ul class="ticks">'
  +'<li>Mulher saudável que está amamentando e tem leite além do que o bebê toma.</li>'
  +'<li>Qualquer idade do bebê serve, desde que você continue amamentando.</li>'
  +'<li>Exames do pré-natal, como hepatite, HIV e sífilis, com resultado negativo.</li>'
  +'<li>Sem uso de cigarro, álcool ou drogas ilícitas.</li>'
  +'<li>Sem medicamentos incompatíveis com a amamentação.</li></ul></div>'
  +'<div><h2>O que acontece com o leite</h2><p style="color:var(--muted)">O leite doado passa por pasteurização e controle de qualidade no banco antes de ir para as UTIs neonatais. Só o excedente é doado, então o seu bebê não fica sem.</p>'
  +'<p class="note" style="margin-top:14px">Leite cru só deve ser dado pela mãe ao próprio filho. Amamentar o bebê de outra mulher não é recomendado pelo Ministério da Saúde nem pela OMS.</p></div>'
  +'</section>'

  +'<section class="block two" id="como">'
  +'<div><h2>Como coletar e guardar</h2><ol class="steps">'
  +'<li>Use um frasco de vidro com tampa plástica rosqueável. Lave e ferva por 15 minutos, contando a partir do início da fervura.</li>'
  +'<li>Prenda os cabelos, use máscara e lave bem as mãos antes de retirar o leite.</li>'

function showErr(id,msg){var el=document.getElementById(id);if(!el)return;el.textContent=msg;el.hidden=false;el.scrollIntoView({block:'nearest'})}

async function submitCad(){
  var v=function(id){return document.getElementById(id).value.trim()};
  var perfil=(document.querySelector('input[name=perfil]:checked')||{}).value||'doadora';
  var nome=v('c-nome'),email=v('c-email').toLowerCase(),tel=v('c-tel'),bairro=v('c-bairro'),s1=document.getElementById('c-senha').value,s2=document.getElementById('c-senha2').value;
  var digits=tel.replace(/\D/g,'');
  if(nome.length<3||nome.indexOf(' ')<0)return showErr('cad-err','Informe seu nome completo.');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return showErr('cad-err','Informe um e-mail válido, como nome@exemplo.com.');
  if(digits.length<10||digits.length>11)return showErr('cad-err','Informe o telefone com DDD, por exemplo (14) 90000-0000.');
  if(s1.length<8)return showErr('cad-err','A senha precisa ter pelo menos 8 caracteres.');
  if(s1!==s2)return showErr('cad-err','As duas senhas são diferentes.');
  if(!document.getElementById('c-lgpd').checked)return showErr('cad-err','Marque a concordância com o uso dos dados para continuar.');
  var list=users();
  if(list.some(function(u){return u.email===email}))return showErr('cad-err','Já existe uma conta com este e-mail. Use Entrar.');
  var salt=Math.random().toString(36).slice(2);
  list.push({nome:nome,email:email,tel:tel,bairro:bairro,perfil:perfil,salt:salt,h:await hash(s1,salt),criado:new Date().toISOString()});
  store.set('lf_users',list);store.set('lf_session',email);
  tab=null;tri={step:0,d:{}};
  toast('Conta criada. Bem-vinda ao LEITE FLOW.');
  location.hash='#painel';
  if(location.hash==='#painel')route();
}
async function submitLogin(){
  var email=document.getElementById('l-email').value.trim().toLowerCase(),pw=document.getElementById('l-senha').value;
  var u=users().filter(function(x){return x.email===email})[0];
  var ok=u&&(await hash(pw,u.salt))===u.h;
  if(!ok)return showErr('log-err','E-mail ou senha incorretos. Confira e tente de novo.');
  store.set('lf_session',email);tab=null;tri={step:0,d:{}};
  location.hash='#painel';
}

function viewRota(u,zona){
  var stops=getStops(),total=stops.length,done=stops.filter(function(s){return s.done}).length;
  var nextI=-1;for(var i=0;i<stops.length;i++){if(!stops[i].done){nextI=i;break}}

  var h='<div class="cols"><div style="display:grid;gap:16px;min-width:0">';
  h+='<div><div class="row" style="justify-content:space-between"><strong>Rota: Hospital Materno Infantil, paradas, retorno ao hospital</strong><span class="mono">'+done+'/'+total+'</span></div><div class="prog" style="margin-top:8px" role="progressbar" aria-valuenow="'+done+'" aria-valuemin="0" aria-valuemax="'+total+'"><i style="width:'+pct+'%"></i></div></div>';
  if(nextI>=0){
    var s=stops[nextI];
    h+='<div class="next-card"><span class="pill next">Próxima parada</span><h3>'+esc(s.nome)+'</h3>'
    +'<p style="color:var(--muted)">'+(s.end?esc(s.end):'Endereço de exemplo. Adicione paradas reais ao lado para abrir o GPS.')+'</p>'
    +'<div class="row">'+(s.end?'<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.end+', Marília, SP')+'">Ir para a parada</a>':'')
    +'<button class="btn gold" type="button" data-a="cheguei" data-id="'+s.id+'">Cheguei</button></div></div>';
  }else if(total){
    h+='<div class="res ok"><h3>Rota concluída</h3><p style="color:var(--ink)">Todas as paradas foram coletadas. Volte ao hospital e entregue a caixa térmica.</p></div>';
  }else{
    h+='<div class="info">Nenhuma parada na rota. Adicione a primeira ao lado.</div>';
  }
  h+='<ul class="timeline">'+stops.map(function(s,i){
    var st=s.done?'done':(i===nextI?'next':'');
    return '<li><span class="dot '+st+'"></span><div style="min-width:0"><div class="nm">'+esc(s.nome)+(s.ex?' <span class="pill ex">exemplo</span>':'')+'</div><div class="ad">'+(s.end?esc(s.end):'Sem endereço')+'</div></div>'
    +'<div class="row">'+(s.done?'<span class="pill ok">Concluída</span>':(i===nextI?'<span class="pill next">Próxima</span>':'<span class="pill">Pendente</span>'))
    +'<button class="btn small" type="button" data-a="rm-stop" data-id="'+s.id+'" aria-label="Remover parada '+esc(s.nome)+'">Remover</button></div></li>';
  }).join('')+'</ul></div>';

  +'<form id="f-stop" novalidate><div id="stop-err" class="err" role="alert" hidden></div>'

  +'<div class="field"><label for="s-end">Endereço</label><input id="s-end" type="text" placeholder="Rua, número, bairro"></div>'
  +'<button class="btn primary" type="submit">Adicionar à rota</button></form>'
  +'<button class="btn small" type="button" data-a="reset-stops">Restaurar paradas de exemplo</button></div></div>';
  return h;
}

function submitFicha(){

function opt(name,val,title,sub,checked){return '<label class="choice"><input type="radio" name="'+name+'" value="'+val+'"'+(checked?' checked':'')+'><div><b>'+title+'</b>'+(sub?'<span>'+sub+'</span>':'')+'</div></label>'}

function viewTriagem(){
  var d=tri.d,st=tri.step,h='<div class="card" style="max-width:640px;display:grid;gap:16px"><div class="stepper">Etapa '+Math.min(st+1,5)+' de 5</div>';
  if(st===4){h+=triResultado(d)+'<div class="row"><button class="btn" type="button" data-a="tri-back">Voltar</button><button class="btn" type="button" data-a="tri-reset">Refazer triagem</button></div></div>';return h}
  h+='<form id="f-tri" novalidate>'+(triErr?'<div class="err" role="alert">'+esc(triErr)+'</div>':'');
  if(st===0)h+='<h3>Parto</h3><div class="field"><label for="t-dn">Data de nascimento do bebê</label><input id="t-dn" type="date" value="'+(d.dn||'')+'"><small>Usada para classificar o leite em colostro, transição ou maduro.</small></div>';
  if(st===1)h+='<h3>Exames e saúde</h3>'+yn('sor','Os exames do pré-natal para hepatite, HIV e sífilis deram negativo?',d,true)+yn('inf','Você está com infecção ou sintomas agora, como febre ou lesões nos seios?',d,false);
  if(st===2)h+='<h3>Hábitos</h3>'+yn('fuma','Você fuma?',d,false)+yn('alc','Você usa álcool ou drogas ilícitas?',d,false);
  if(st===3)h+='<h3>Medicamentos e tatuagem</h3>'+yn('med','Você usa algum medicamento incompatível com a amamentação?',d,true)+yn('tat','Fez tatuagem ou piercing nos últimos 12 meses?',d,false);
  h+='<div class="row" style="margin-top:6px">'+(st>0?'<button class="btn" type="button" data-a="tri-back">Voltar</button>':'')+'<button class="btn primary" type="submit">'+(st===3?'Ver resultado':'Continuar')+'</button></div></form></div>';
  return h;
}
function readTri(){
  var st=tri.step,d=tri.d,g=function(n){var e=document.querySelector('input[name='+n+']:checked');return e?e.value:null};
  triErr='';
  if(st===0){
    var v=document.getElementById('t-dn').value;
    if(!v){triErr='Informe a data de nascimento do bebê.';return false}
    if(new Date(v+'T00:00:00')>new Date()){triErr='A data não pode estar no futuro.';return false}
    d.dn=v;
  }
  var need={1:['sor','inf'],2:['fuma','alc'],3:['med','tat']}[st]||[];
  for(var i=0;i<need.length;i++){var x=g(need[i]);if(!x){triErr='Responda todas as perguntas para continuar.';return false}d[need[i]]=x}
  return true;
}
function triResultado(d){
  var nogo=[],pend=[];
  if(d.sor==='nao')nogo.push('Exames de hepatite, HIV e sífilis sem resultado negativo.');
  if(d.sor==='nsei')pend.push('Confirmar os exames do pré-natal para hepatite, HIV e sífilis.');
  if(d.inf==='sim')nogo.push('Infecção ou sintomas no momento.');
  if(d.fuma==='sim')nogo.push('Uso de cigarro.');
  if(d.alc==='sim')nogo.push('Uso de álcool ou drogas ilícitas.');
  if(d.med==='sim')nogo.push('Medicamento incompatível com a amamentação.');
  if(d.med==='nsei')pend.push('Conferir com a equipe se os medicamentos em uso permitem doar.');
  if(d.tat==='sim')nogo.push('Tatuagem ou piercing nos últimos 12 meses (regra do projeto).');
  var dias=Math.max(1,Math.floor((Date.now()-new Date(d.dn+'T00:00:00').getTime())/86400000));
  var cls=dias<=7?'Colostro':dias<=14?'Transição':'Maduro';
  var h;
  if(nogo.length){
    h='<div class="res bad"><h3>Não apta no momento</h3><ul>'+nogo.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><p style="color:var(--ink)">A equipe do banco pode reavaliar seu caso. Ligue para <span class="mono">'+PHONE+'</span>.</p></div>';
  }else if(pend.length){
    h='<div class="res pend"><h3>Falta confirmar com a equipe</h3><ul>'+pend.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul><p>Dia '+dias+' após o parto. Classificação prevista do leite: '+cls+'.</p></div>';
  }else{
    h='<div class="res ok"><h3>Apta para seguir</h3><p style="color:var(--ink)">Dia '+dias+' após o parto. Classificação prevista do leite: <strong>'+cls+'</strong>.</p><p style="color:var(--ink)">Próximo passo: ligue para o banco em <span class="mono">'+PHONE+'</span> e combine a coleta.</p></div>';
  }
  return h+'<p style="font-size:.9rem;color:var(--muted)">Triagem de apoio. A avaliação oficial é feita pela equipe do Banco de Leite Humano.</p>';
}

/* ---------- eventos ---------- */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a');
  if(a==='scroll'){var el=document.getElementById(b.getAttribute('data-t'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='copy'){var t=b.getAttribute('data-text');
    try{navigator.clipboard.writeText(t).then(function(){toast('Telefone copiado')},function(){toast('Telefone: '+t)})}catch(x){toast('Telefone: '+t)}}
  else if(a==='tab'){tab=b.getAttribute('data-t');paint()}
  else if(a==='cheguei'){ficha=b.getAttribute('data-id');fichaVol=200;paint()}
  else if(a==='fecha-ficha'){ficha=null;paint()}
  else if(a==='vol'){fichaVol=parseInt(b.getAttribute('data-v'),10);document.getElementById('f-vol').value=fichaVol;
    document.querySelectorAll('.qv button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})}
  else if(a==='rm-stop'){var id=b.getAttribute('data-id');store.set('lf_stops',getStops().filter(function(s){return s.id!==id}));paint()}
  else if(a==='reset-stops'){store.set('lf_stops',SEED.map(function(x){return Object.assign({},x)}));paint();toast('Paradas de exemplo restauradas')}
  else if(a==='tri-back'){tri.step=Math.max(0,tri.step-1);triErr='';paint()}
  else if(a==='tri-reset'){tri={step:0,d:{}};triErr='';paint()}
});
nav.addEventListener('click',function(e){
  if(e.target.closest('[data-a="logout"]')){store.set('lf_session',null);tab=null;tri={step:0,d:{}};ficha=null;toast('Você saiu da conta.');location.hash='#sobre';if(location.hash==='#sobre')route();route()}
});
app.addEventListener('submit',function(e){
  e.preventDefault();var id=e.target.id;
  if(id==='f-cad')submitCad();
  else if(id==='f-login')submitLogin();
  else if(id==='f-ficha')submitFicha();
  else if(id==='f-stop'){
    var n=document.getElementById('s-nome').value.trim(),ad=document.getElementById('s-end').value.trim();
    if(!n||!ad)return showErr('stop-err','Informe o nome da doadora e o endereço.');
    var s=getStops();s.push({id:'p'+Date.now(),nome:n,end:ad,done:false,ex:false});store.set('lf_stops',s);paint();toast('Parada adicionada')
  }
  else if(id==='f-tri'){if(readTri()){tri.step++}paint()}
});
app.addEventListener('input',function(e){
  if(e.target.id==='f-temp'){var w=document.getElementById('temp-warn'),v=parseFloat(e.target.value);w.hidden=!(v>-10)}
  if(e.target.id==='f-vol'){var n=parseInt(e.target.value,10);document.querySelectorAll('.qv button').forEach(function(x){x.setAttribute('aria-pressed',String(parseInt(x.getAttribute('data-v'),10)===n))})}
});
window.addEventListener('hashchange',route);
route();
})();
</script>
